trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - name: azureServiceConnection
    value: 'REPLACE_WITH_AZURE_RM_SERVICE_CONNECTION'

  - name: acrName
    value: 'eaacr'

  - name: acrLoginServer
    value: 'eaacr.azurecr.io'

  - name: azureResourceGroup
    value: 'rg-employee-attendance'

  - name: aksCluster
    value: 'aks-employee-attendance'

  - name: imageRepository
    value: 'employee-attendance'

  - name: imageTag
    value: '$(Build.BuildId)'

  - name: kubernetesNamespace
    value: 'attendance-app'

stages:
  - stage: BuildAndTest
    displayName: Test application and build image in Azure
    jobs:
      - job: TestAndBuild
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            displayName: Use Python 3.11
            inputs:
              versionSpec: '3.11'
              addToPath: true
          - script: |
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
              python -m pip install -r requirements-dev.txt
            displayName: Install Python dependencies
          - script: python -m pytest -v
            displayName: Run application tests
          # ACR Tasks builds the image in Azure. No local Docker daemon is used.
          - task: AzureCLI@2
            displayName: Build and push image using Azure Container Registry Tasks
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr show --name "$(acrName)" --resource-group "$(azureResourceGroup)" --output none
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(imageRepository):$(imageTag)" \
                  .

  - stage: DeployToAKS
    displayName: Deploy application to AKS
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployAttendance
        displayName: Deploy Employee Attendance
        environment: employee-attendance-aks
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: KubernetesManifest@1
                  displayName: Apply namespace, deployment and service
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: $(azureServiceConnection)
                    azureResourceGroup: $(azureResourceGroup)
                    kubernetesCluster: $(aksCluster)
                    namespace: $(kubernetesNamespace)
                    manifests: |
                      k8s/namespace.yaml
                      k8s/deployment.yaml
                      k8s/service.yaml
                    containers: |
                      $(acrLoginServer)/$(imageRepository):$(imageTag)

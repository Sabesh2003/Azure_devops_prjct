apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-app
  namespace: attendance-app
  labels:
    app: attendance-app
spec:
  # Keep one replica while the app uses a local SQLite file.
  # Move to shared persistent storage or a managed database before scaling replicas.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: attendance-app
  template:
    metadata:
      labels:
        app: attendance-app
    spec:
      containers:
        - name: attendance-app
          image: eaacr.azurecr.io/employee-attendance:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
